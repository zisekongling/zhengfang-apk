plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Shared by the App and the separately installed browser APK. Keep it free of App state:
// only the Binder wire format, error codes, URL rules and peer verification live here.
android {
    namespace 'com.tyust.course.browser.protocol'
    compileSdkVersion 'android-37.0'

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20231013'
}
