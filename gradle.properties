org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=37.0
org.gradle.configuration-cache=true
# AGP 8.13's bundled Lint cannot read Kotlin 2.4 metadata used by QuickJS.
# AGP expects the tools version here and maps 9.4.1 to lint 32.4.1.
android.experimental.lint.version=9.4.1

# Keep the existing Kotlin 2.4 and Groovy DSL integration on AGP 9.1.
android.builtInKotlin=false
android.newDsl=false

# Separately installed GeckoView component (:browser). versionCode = Gecko major * 100 + revision.
# The App refuses a browser older than BROWSER_VERSION_CODE; bump both together.
BROWSER_GECKO_VERSION=157.0.20261005135250
BROWSER_VERSION_CODE=15701
BROWSER_VERSION_NAME=157.1
