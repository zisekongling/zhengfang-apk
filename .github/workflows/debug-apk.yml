name: Debug APK
run-name: Debug APK · ${{ github.ref_name }}@${{ github.sha }}

# 只打 debug 包供安装试用：不读签名或发布凭据，不跑单测（单测在 Android Unit Tests 里）。
# 产物按运行附在 Actions 页面的 Artifacts 里，保留 14 天。
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'release-notes/**'
      - 'archive/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'release-notes/**'
      - 'archive/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      # compileSdk 是 android-37.0：运行镜像里的平台不一定有，先补齐（已装则原样通过）。
      - name: Ensure the compile SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" > /dev/null \
            || "$SDKMANAGER" --channel=3 "platforms;android-37.0" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-(34|37)" || true
      - name: Assemble the debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-parallel --max-workers=2 --console=plain
      - name: Name the APK after version and commit
        id: apk
        run: |
          VERSION=$(grep '^VERSION_NAME=' app/version.properties | cut -d= -f2)
          NAME="zhengfang-${VERSION}-debug-${GITHUB_SHA::7}"
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk "delivery/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: delivery/*.apk
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Summarize
        env:
          APK: ${{ steps.apk.outputs.name }}
        run: |
          echo "Debug APK: \`${APK}.apk\`（见本次运行的 Artifacts，保留 14 天）" >> "$GITHUB_STEP_SUMMARY"
          echo "每次运行使用 Runner 临时生成的 debug 签名：覆盖安装上一次的 debug 包前需先卸载。" >> "$GITHUB_STEP_SUMMARY"
