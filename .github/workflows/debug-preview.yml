name: Debug Preview
run-name: 调试预览 · ${{ github.ref_name }}@${{ github.sha }}

# 构建 debug 主 App 与按需安装的内置浏览器组件，并发布为预发布 Release，供真机试用。
# 不使用正式签名、不改更新清单、不同步 Gitee；正式发布仍走 release.yml / promote-release.yml。
on:
  push:
    branches: [feat/browser-component]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Ensure the compile SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" > /dev/null \
            || "$SDKMANAGER" --channel=3 "platforms;android-37.0" > /dev/null
      # Both APKs must share one signer. A stored debug keystore also keeps it stable across
      # runs, so a newer preview installs over an older one. Without the secret, AGP generates
      # a fresh key per run and users must uninstall the previous preview first.
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android && umask 077
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "STABLE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "STABLE_KEY=false" >> "$GITHUB_ENV"
          fi
      - name: Test protocol and assemble both debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :browser-protocol:testDebugUnitTest :app:assembleDebug :browser:assembleDebug --no-parallel --max-workers=2 --console=plain
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^VERSION_NAME=' app/version.properties | cut -d= -f2)
          BROWSER=$(grep '^BROWSER_VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-debug.${RUN}"
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk "delivery/zhengfang-${VERSION}-debug.apk"
          cp browser/build/outputs/apk/debug/browser-debug.apk "delivery/browser-${BROWSER}-debug.apk"
          if [ "$STABLE_KEY" = true ]; then
            KEY_NOTE="使用仓库固定的 debug 签名，可直接覆盖安装之前的预览版。"
          else
            KEY_NOTE="本次 debug 签名由 CI 临时生成：安装前需卸载之前的预览版。"
          fi
          {
            echo "调试预览，**不是正式版本**。源码：\`${REF}\` @ \`${SHA}\`。"
            echo
            echo "- \`zhengfang-${VERSION}-debug.apk\`：主 App \`com.tyust.course.debug\`（不含 GeckoView）"
            echo "- \`browser-${BROWSER}-debug.apk\`：内置浏览器组件 \`com.tyust.course.browser.debug\`（GeckoView，Android 8+）"
            echo
            echo "两个包同一签名，须成对安装。包名带 .debug，可与正式版同时安装，账号数据互不影响。${KEY_NOTE}"
            echo "安装：先装主 App，再在插件中心 → 菜单 →「内置浏览器组件」→「从文件安装组件」选浏览器 APK，或用 adb 安装两个包。"
            echo
            echo "SHA-256"
            (cd delivery && sha256sum *.apk | sed 's/^\([0-9a-f]*\)  \(.*\)$/- \2 `\1`/')
          } > delivery/notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "${VERSION} debug.${RUN} · 内置浏览器拆分预览" --notes-file delivery/notes.md delivery/*.apk
          echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
