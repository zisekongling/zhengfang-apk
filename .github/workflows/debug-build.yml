name: Debug Build
run-name: Debug 构建 · ${{ github.ref_name }}@${{ github.sha }}

# 只构建 debug 主 App（com.tyust.course.debug）与 debug 内置浏览器组件
# （com.tyust.course.browser.debug），作为 Actions 产物上传；不创建 Release、不用正式签名。
on:
  push:
    branches: [feat/browser-component]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Ensure the compile SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" > /dev/null \
            || "$SDKMANAGER" --channel=3 "platforms;android-37.0" > /dev/null
      # Both APKs are built in one job, so they always share the same debug signer.
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android && umask 077
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          fi
      - name: Assemble debug App and debug browser
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :browser:assembleDebug --no-parallel --max-workers=2 --console=plain
      - name: Collect APKs
        run: |
          VERSION=$(grep '^VERSION_NAME=' app/version.properties | cut -d= -f2)
          BROWSER=$(grep '^BROWSER_VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk "delivery/zhengfang-${VERSION}-debug.apk"
          cp browser/build/outputs/apk/debug/browser-debug.apk "delivery/browser-${BROWSER}-debug.apk"
          (cd delivery && sha256sum *.apk) | tee delivery/SHA256SUMS
          {
            echo "### Debug APKs"
            echo '```'
            cat delivery/SHA256SUMS
            echo '```'
            echo "两个包同一签名，须成对安装；包名带 .debug，可与正式版共存。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: delivery/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
